<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>RMS · RAM monitor</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>RMS</h1>
      <span id="mode" class="badge" hidden></span>
    </div>
    <p id="host" class="host"></p>
  </header>

  <p id="banner" class="banner" hidden>Sample data. <a href="https://github.com/adminpydev/RMS#install">Install RMS</a> to see your own machine.</p>

  <p id="status" class="status" role="status">Loading…</p>

  <main id="main" hidden>
    <p id="system" class="system" aria-label="System memory"></p>

    <section id="insights" class="insights" aria-label="Insights" aria-live="polite"></section>

    <section class="panel live" aria-label="Processes">
      <div class="live-bar">
        <label class="search"><span class="sr">Search processes</span><input type="search" id="live-search" placeholder="Search name, command, app or PID" autocomplete="off"></label>
        <button type="button" id="live-pause" class="btn" aria-pressed="false">Pause</button>
        <p id="live-meta" class="live-meta" role="status"></p>
      </div>
      <div class="table-wrap live-wrap">
        <table class="apps" id="live-table">
          <thead><tr>
            <th scope="col" class="num" data-sort="pid"><button type="button">PID</button></th>
            <th scope="col" data-sort="name"><button type="button">Process</button></th>
            <th scope="col" data-sort="app"><button type="button">App</button></th>
            <th scope="col" data-sort="user"><button type="button">User</button></th>
            <th scope="col" class="num" data-sort="rss"><button type="button">Memory</button></th>
            <th scope="col" class="num" data-sort="growth_5m"><button type="button">Δ 5 min</button></th>
            <th scope="col" class="num" data-sort="growth_30m"><button type="button">Δ 30 min</button></th>
            <th scope="col" class="num" data-sort="cpu"><button type="button">CPU</button></th>
            <th scope="col" class="num" data-sort="threads"><button type="button">Threads</button></th>
            <th scope="col">Last 10 min</th>
          </tr></thead>
          <tbody id="live-body"></tbody>
        </table>
      </div>
      <p id="live-count" class="hint"></p>
    </section>
  </main>

  <dialog id="proc" aria-labelledby="proc-title">
    <div class="dlg">
      <div class="dlg-head">
        <h2 id="proc-title">Process</h2>
        <form method="dialog"><button type="submit" class="btn">Close</button></form>
      </div>
      <div id="proc-body"></div>
    </div>
  </dialog>
</div>
</body>
</html>
