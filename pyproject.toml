[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rms-monitor"
dynamic = ["version"]
description = "Local RAM monitor: live, in-memory, localhost dashboard"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = ["psutil"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rms = "rms.cli:main"

[tool.setuptools]
packages = ["rms"]

[tool.setuptools.dynamic]
version = {attr = "rms.__version__"}

[tool.setuptools.package-data]
rms = ["web/**/*"]
